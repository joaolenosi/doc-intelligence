# Sobe o ambiente inteiro: banco, fila, API e worker.
#
# API e worker sao servicos separados de proposito. E a prova executavel do
# ADR-003: com tudo no mesmo processo, "o processamento nao depende do ciclo da
# requisicao" e uma afirmacao que ninguem consegue verificar.
#
# Para ver a troca de peca do ADR-004, rode com FILA_ADAPTADOR=postgres e
# derrube o Redis. O fluxo continua funcionando.

x-aplicacao: &aplicacao
  build: .
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-doc}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doc}
    POSTGRES_DB: ${POSTGRES_DB:-doc_intelligence}
    REDIS_HOST: redis
    REDIS_PORT: 6379
    FILA_ADAPTADOR: ${FILA_ADAPTADOR:-bullmq}
    FILA_CONCORRENCIA: ${FILA_CONCORRENCIA:-5}
    DUBLE_MODO: ${DUBLE_MODO:-SUCESSO}
    EXTRATOR_TIMEOUT_MS: ${EXTRATOR_TIMEOUT_MS:-60000}
    EXTRATOR_MAX_TENTATIVAS: ${EXTRATOR_MAX_TENTATIVAS:-3}
    CONFIANCA_LIMIAR_TIPO: ${CONFIANCA_LIMIAR_TIPO:-0.80}
    CONFIANCA_LIMIAR_CAMPO: ${CONFIANCA_LIMIAR_CAMPO:-0.85}
    API_KEY: ${API_KEY:-chave-de-desenvolvimento}
    ARMAZENAMENTO_DIRETORIO: /app/storage
  volumes:
    # Os arquivos vivem fora do container. Documento de cliente nao pode sumir
    # num `docker compose down`.
    - documentos:/app/storage

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doc}
      POSTGRES_DB: ${POSTGRES_DB:-doc_intelligence}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dados:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doc} -d ${POSTGRES_DB:-doc_intelligence}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *aplicacao
    command: ["node", "dist/src/main.js"]
    ports:
      - "${PORTA:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      # A rota consulta o banco: processo respondendo com o banco fora esta
      # vivo, e nao saudavel.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *aplicacao
    command: ["node", "dist/src/worker.js"]
    depends_on:
      # Espera a API porque e ela que roda as migrations. Dois workers subindo
      # juntos disputariam a mesma migration.
      api: { condition: service_healthy }
    # O worker escala horizontalmente sem nenhuma coordenacao extra: no BullMQ o
    # Redis distribui, e no Postgres o SKIP LOCKED faz o mesmo papel.
    deploy:
      replicas: ${WORKERS:-1}

volumes:
  postgres_dados:
  documentos:
